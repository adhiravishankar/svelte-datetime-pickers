name: Publish

on:
  release:
    types: [published]

env:
  HUSKY: 0

permissions:
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ⚠️ Do not cache dependencies in publish workflows
      # Restoring package-manager cache here increases the risk of a compromised release

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Packages are listed in dependency order
      - name: Publish with latest tag
        if: github.event.release.prerelease == false
        run: |
          for package in svelte-fit-action svelte-analog-clock svelte-range-calendar svelte-date-input svelte-time-input svelte-datetime-input svelte-datetimerange-picker; do
            npm publish --workspace "$package" --tag latest
          done

      - name: Publish with next tag
        if: github.event.release.prerelease == true
        run: |
          for package in svelte-fit-action svelte-analog-clock svelte-range-calendar svelte-date-input svelte-time-input svelte-datetime-input svelte-datetimerange-picker; do
            npm publish --workspace "$package" --tag next
          done
